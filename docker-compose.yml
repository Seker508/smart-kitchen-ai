# Yerel geliştirme için PostgreSQL (isteğe bağlı). Çalıştırma: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartkitchen
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./docs/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro]
volumes:
  pgdata:
